<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>CacheIQ — Cache Entries</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    body { overflow-y: auto; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #eff4ff; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #bcc9c6; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6d7a77; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface": "#0b1c30",
            "secondary": "#006c4a",
            "outline": "#6d7a77",
            "primary": "#00685f",
            "surface": "#f8f9ff",
            "surface-container-low": "#eff4ff",
            "surface-container-lowest": "#ffffff",
            "outline-variant": "#bcc9c6"
          },
          fontFamily: {
            "code": ["JetBrains Mono"],
            "body": ["Inter"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body text-body text-on-surface antialiased">
  <header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest border-b border-outline-variant/40">
    <div class="h-14 w-full px-6 flex items-center justify-between gap-4">
      <div class="flex items-center gap-8">
        <a class="flex items-center gap-1.5" href="/">
          <span class="tracking-tight font-bold text-lg">CacheIQ</span>
          <span class="h-2 w-2 rounded-full bg-primary inline-block"></span>
        </a>
        <nav class="flex items-center gap-6 h-14">
          <a class="inline-flex items-center h-full px-1 text-slate-500 hover:text-on-surface transition-colors" href="/">Chat</a>
          <a class="inline-flex items-center h-full px-1 text-slate-500 hover:text-on-surface transition-colors" href="/analytics.html">Analytics</a>
          <a class="inline-flex items-center h-full px-1 text-on-surface font-semibold border-b-2 border-primary" href="/entries.html">Entries</a>
          <a class="inline-flex items-center h-full px-1 text-slate-500 hover:text-on-surface transition-colors" href="/arena.html">Arena</a>
        </nav>
      </div>
      <div class="flex items-center gap-4">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded bg-surface-container-low border border-outline-variant/60 font-code text-xs text-slate-600">
          <span>Total Entries: <strong id="entries-total" class="text-on-surface font-bold">0</strong></span>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full pt-20 pb-12 bg-surface min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
      
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Active Cache Entries</h1>
          <p class="text-sm text-slate-500 mt-1">Inspected embeddings, hit counts, TTL, and manual invalidation.</p>
        </div>
        <button id="refresh-entries-btn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-outline-variant/70 bg-white hover:bg-slate-50 text-xs font-semibold">
          <span class="material-symbols-outlined text-[16px]">refresh</span>
          Refresh
        </button>
      </div>

      <!-- Entries Table (PRD §9 contract: #entries-body, #entries-total) -->
      <div class="bg-white border border-outline-variant/60 rounded-xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 border-b border-outline-variant/40 text-xs uppercase font-semibold text-slate-500 tracking-wider">
                <th class="py-3 px-4">ID</th>
                <th class="py-3 px-4">Query Text</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4">Hit Count</th>
                <th class="py-3 px-4">Created</th>
                <th class="py-3 px-4">Expires</th>
                <th class="py-3 px-4 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="entries-body" class="divide-y divide-outline-variant/30 text-sm">
              <tr>
                <td colspan="7" class="py-8 text-center text-slate-400 italic font-body">Loading entries...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/entries.js"></script>
</body>
</html>
