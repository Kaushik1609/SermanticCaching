name: CacheIQ CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cacheiq
          POSTGRES_PASSWORD: cacheiq
          POSTGRES_DB: cacheiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://cacheiq:cacheiq@localhost:5432/cacheiq
        run: |
          python -m backend.engine.store.migrate

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://cacheiq:cacheiq@localhost:5432/cacheiq
          LLM_PROVIDER: mock
          MOCK_API: 0
        run: |
          pytest backend/tests -v

      - name: Run evaluation scripts
        run: |
          python scripts/threshold_sweep.py
          python scripts/benchmark_latency.py

