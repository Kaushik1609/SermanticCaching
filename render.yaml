services:
  - type: web
    name: cacheiq-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_KEY
        value: changeme
      - key: T_HIT
        value: 0.85
      - key: T_LOW
        value: 0.75
      - key: DATABASE_URL
        fromDatabase:
          name: cacheiq-db
          property: connectionString

databases:
  - name: cacheiq-db
    databaseName: cacheiq
    user: cacheiq
    plan: free
    region: oregon
    postgresMajorVersion: 16
